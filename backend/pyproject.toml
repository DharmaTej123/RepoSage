[project]
name = "reposage"
version = "0.1.0"
description = "RepoSage — Codebase Onboarding & Tech-Debt Copilot (evidence-driven multi-agent analysis)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "httpx>=0.27",
    "networkx>=3.3",
    "numpy>=1.26",
    "neo4j>=5.24",
    "packaging>=24.0",
    "langgraph>=0.2.28",
    "langgraph-checkpoint-sqlite>=2.0",
    "docker>=7.1",
    "coverage>=7.6",
    "redis>=5.0",
    "rq>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
